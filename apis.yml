apis:
  - aid: sorsa:sorsa-api-v3
    name: Sorsa API v3
    description: >-
      The Sorsa API v3 is a RESTful API exposing 40 endpoints for real-time X (Twitter) data: user profiles and About
      metadata, followers and following lists, tweet data (single and batch), articles, user timelines, comments,
      quotes, retweets, search of tweets and users, mentions, Twitter Spaces (Places), lists, communities, engagement
      and membership verification, Sorsa Score crypto-influence analytics, follower category breakdowns, and technical
      utilities (username/user-id conversion, profile-link parsing, API-key usage). Authentication uses a simple
      `ApiKey` header.

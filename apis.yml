description: >-
  Sorsa Labs operates a real-time X (Twitter) data API providing developers access to tweets, profiles, search,
  mentions, lists, communities, engagement verification, and Sorsa Score crypto-influence analytics through 40 REST
  endpoints. It markets itself as an affordable alternative to the official X API and was formerly known as Tweetscout.

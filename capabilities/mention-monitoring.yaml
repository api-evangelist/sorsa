apiVersion: naftiko.io/v1
kind: Capability
metadata:
  name: mention-monitoring
  description: >-
    Poll mentions of a target handle filtered by engagement thresholds and
    optional date range; for each mention, fetch the author's profile and
    Sorsa Score so downstream systems can prioritize high-influence mentions.
spec:
  provider: sorsa
  steps:
    - use: sorsa.search.mentions
      bind:
        username: ${input.handle}
        min_likes: ${input.min_likes}
        min_replies: ${input.min_replies}
        min_retweets: ${input.min_retweets}
        since: ${input.since}
        until: ${input.until}
        sort: latest
    - foreach: ${steps[0].tweets}
      use: sorsa.score.get
      bind:
        user_id: ${item.user.id_str}

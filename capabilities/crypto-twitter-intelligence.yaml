apiVersion: naftiko.io/v1
kind: Capability
metadata:
  name: crypto-twitter-intelligence
  description: >-
    End-to-end workflow for tracking crypto Twitter (CT) influence: resolve a
    target account, fetch profile and follower category breakdown, compute
    Sorsa Score and 7-day/30-day deltas, and enumerate the top-20 followers and
    followings by score.
spec:
  provider: sorsa
  steps:
    - use: sorsa.tech.username-to-id
      bind:
        user_handle: ${input.handle}
    - use: sorsa.user.profile.get
      bind:
        username: ${input.handle}
    - use: sorsa.followers.category-stats
      bind:
        username: ${input.handle}
    - use: sorsa.score.get
      bind:
        username: ${input.handle}
    - use: sorsa.score.changes
      bind:
        username: ${input.handle}
    - use: sorsa.top.followers
      bind:
        username: ${input.handle}
    - use: sorsa.top.following
      bind:
        username: ${input.handle}

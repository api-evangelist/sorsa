naftiko: 1.0.0-alpha2
info:
  label: Sorsa API — Community
  description: 'Sorsa API — Community. 3 operations. Lead operation: Community Members. Self-contained Naftiko capability
    covering one Sorsa business surface.'
  tags:
  - Sorsa
  - Community
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SORSA_API_KEY: SORSA_API_KEY
capability:
  consumes:
  - type: http
    namespace: sorsa-community
    baseUri: https://api.sorsa.io/v3
    description: Sorsa API — Community business capability. Self-contained, no shared references.
    resources:
    - name: community-members
      path: /community-members
      operations:
      - name: post
        method: POST
        description: Community Members
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: community-search-tweets
      path: /community-search-tweets
      operations:
      - name: post
        method: POST
        description: Search Community Tweets
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: community-tweets
      path: /community-tweets
      operations:
      - name: post
        method: POST
        description: Community Tweets
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: ApiKey
      value: '{{env.SORSA_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: sorsa-community-rest
    port: 8080
    description: REST adapter for Sorsa API — Community. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/community-members
      name: community-members
      description: REST surface for community-members.
      operations:
      - method: POST
        name: post
        description: Community Members
        call: sorsa-community.post
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/community-search-tweets
      name: community-search-tweets
      description: REST surface for community-search-tweets.
      operations:
      - method: POST
        name: post
        description: Search Community Tweets
        call: sorsa-community.post
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/community-tweets
      name: community-tweets
      description: REST surface for community-tweets.
      operations:
      - method: POST
        name: post
        description: Community Tweets
        call: sorsa-community.post
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: sorsa-community-mcp
    port: 9090
    transport: http
    description: MCP adapter for Sorsa API — Community. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: community-members
      description: Community Members
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: sorsa-community.post
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: search-community-tweets
      description: Search Community Tweets
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: sorsa-community.post
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: community-tweets
      description: Community Tweets
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: sorsa-community.post
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.

naftiko: 1.0.0-alpha2
info:
  label: Sorsa API — Verification
  description: 'Sorsa API — Verification. 5 operations. Lead operation: Check Comment. Self-contained Naftiko capability covering
    one Sorsa business surface.'
  tags:
  - Sorsa
  - Verification
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SORSA_API_KEY: SORSA_API_KEY
capability:
  consumes:
  - type: http
    namespace: sorsa-verification
    baseUri: https://api.sorsa.io/v3
    description: Sorsa API — Verification business capability. Self-contained, no shared references.
    resources:
    - name: check-comment
      path: /check-comment
      operations:
      - name: get
        method: GET
        description: Check Comment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: tweet_link
          in: query
          type: string
          description: Full URL of the tweet to check.
          required: true
        - name: username
          in: query
          type: string
          description: Twitter/X handle of the user being checked.
        - name: user_link
          in: query
          type: string
          description: Twitter/X profile link of the user being checked.
        - name: user_id
          in: query
          type: string
          description: Numeric Twitter/X user ID of the user being checked.
    - name: check-community-member
      path: /check-community-member
      operations:
      - name: post
        method: POST
        description: Check Community Membership
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: check-follow
      path: /check-follow
      operations:
      - name: post
        method: POST
        description: Check Follow
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: check-quoted
      path: /check-quoted
      operations:
      - name: post
        method: POST
        description: Check Quote or Retweet
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: check-retweet
      path: /check-retweet
      operations:
      - name: post
        method: POST
        description: Check Retweet
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: ApiKey
      value: '{{env.SORSA_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: sorsa-verification-rest
    port: 8080
    description: REST adapter for Sorsa API — Verification. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/check-comment
      name: check-comment
      description: REST surface for check-comment.
      operations:
      - method: GET
        name: get
        description: Check Comment
        call: sorsa-verification.get
        with:
          tweet_link: rest.tweet_link
          username: rest.username
          user_link: rest.user_link
          user_id: rest.user_id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/check-community-member
      name: check-community-member
      description: REST surface for check-community-member.
      operations:
      - method: POST
        name: post
        description: Check Community Membership
        call: sorsa-verification.post
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/check-follow
      name: check-follow
      description: REST surface for check-follow.
      operations:
      - method: POST
        name: post
        description: Check Follow
        call: sorsa-verification.post
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/check-quoted
      name: check-quoted
      description: REST surface for check-quoted.
      operations:
      - method: POST
        name: post
        description: Check Quote or Retweet
        call: sorsa-verification.post
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/check-retweet
      name: check-retweet
      description: REST surface for check-retweet.
      operations:
      - method: POST
        name: post
        description: Check Retweet
        call: sorsa-verification.post
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: sorsa-verification-mcp
    port: 9090
    transport: http
    description: MCP adapter for Sorsa API — Verification. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: check-comment
      description: Check Comment
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: sorsa-verification.get
      with:
        tweet_link: tools.tweet_link
        username: tools.username
        user_link: tools.user_link
        user_id: tools.user_id
      outputParameters:
      - type: object
        mapping: $.
    - name: check-community-membership
      description: Check Community Membership
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: sorsa-verification.post
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: check-follow
      description: Check Follow
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: sorsa-verification.post
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: check-quote-retweet
      description: Check Quote or Retweet
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: sorsa-verification.post
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: check-retweet
      description: Check Retweet
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: sorsa-verification.post
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.

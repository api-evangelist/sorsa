apiVersion: naftiko.io/v1
kind: SharedCapability
metadata:
  name: sorsa-api-v3
  provider: sorsa
  description: Shared capability definitions for the Sorsa API v3 (real-time X/Twitter data).
spec:
  baseUrl: https://api.sorsa.io/v3
  auth:
    type: apiKey
    in: header
    name: ApiKey
  capabilities:
    - id: sorsa.user.profile.get
      operationId: getUserProfile
      method: GET
      path: /info
      summary: Fetch a public X profile by username, user_link, or user_id.
    - id: sorsa.user.profile.batch
      method: GET
      path: /info-batch
      summary: Batch-fetch up to 100 X profiles in a single request.
    - id: sorsa.user.about.get
      method: GET
      path: /about
      summary: Retrieve account About metadata (country, username history).
    - id: sorsa.user.followers.list
      method: GET
      path: /followers
      summary: Paginate followers for a target account (200 per page).
    - id: sorsa.user.following.list
      method: GET
      path: /follows
      summary: Paginate accounts a target user follows (200 per page).
    - id: sorsa.user.verified-followers.list
      method: GET
      path: /verified-followers
      summary: Paginate verified-only followers for a target account.
    - id: sorsa.tweet.data.get
      method: POST
      path: /tweet-info
      summary: Fetch a single tweet's full data by URL or ID.
    - id: sorsa.tweet.data.batch
      method: POST
      path: /tweet-info-bulk
      summary: Batch-fetch up to 100 tweets in a single request.
    - id: sorsa.tweet.article.get
      method: POST
      path: /article
      summary: Fetch a long-form X Article by URL.
    - id: sorsa.tweet.timeline.list
      method: POST
      path: /user-tweets
      summary: Paginate a user's timeline.
    - id: sorsa.tweet.comments.list
      method: POST
      path: /comments
      summary: Paginate replies under a tweet.
    - id: sorsa.tweet.quotes.list
      method: POST
      path: /quotes
      summary: Paginate quote tweets of a tweet.
    - id: sorsa.tweet.retweeters.list
      method: POST
      path: /retweeters
      summary: Paginate users who retweeted a tweet.
    - id: sorsa.search.tweets
      method: POST
      path: /search-tweets
      summary: Advanced tweet search with X-compatible operators.
    - id: sorsa.search.users
      method: POST
      path: /search-users
      summary: Keyword search for X accounts.
    - id: sorsa.search.mentions
      method: POST
      path: /mentions
      summary: Search tweets mentioning a target account with engagement filters.
    - id: sorsa.list.tweets
      method: GET
      path: /list-tweets
      summary: Paginate tweets from a Twitter/X List.
    - id: sorsa.list.members
      method: GET
      path: /list-members
      summary: Get members of a Twitter/X List.
    - id: sorsa.list.followers
      method: GET
      path: /list-followers
      summary: Get followers of a Twitter/X List.
    - id: sorsa.community.tweets
      method: POST
      path: /community-tweets
      summary: Paginate tweets from a Twitter/X Community.
    - id: sorsa.community.members
      method: POST
      path: /community-members
      summary: Get members of a Twitter/X Community.
    - id: sorsa.community.search
      method: POST
      path: /community-search-tweets
      summary: Search tweets within a Community.
    - id: sorsa.verify.follow
      method: POST
      path: /check-follow
      summary: Check whether one account follows another.
    - id: sorsa.verify.comment
      method: GET
      path: /check-comment
      summary: Check whether a user commented under a tweet.
    - id: sorsa.verify.retweet
      method: POST
      path: /check-retweet
      summary: Check whether a user retweeted a tweet.
    - id: sorsa.verify.quote
      method: POST
      path: /check-quoted
      summary: Check whether a user quoted or retweeted a tweet.
    - id: sorsa.verify.community-member
      method: POST
      path: /check-community-member
      summary: Check whether a user is a member of a Community.
    - id: sorsa.score.get
      method: GET
      path: /score
      summary: Get the Sorsa Score for an account.
    - id: sorsa.score.changes
      method: GET
      path: /score-changes
      summary: Get 7-day and 30-day Sorsa Score deltas.
    - id: sorsa.followers.category-stats
      method: GET
      path: /followers-stats
      summary: Categorize an account's followers into influencers, projects, and VCs.
    - id: sorsa.top.followers
      method: GET
      path: /top-followers
      summary: Top 20 followers by Sorsa Score.
    - id: sorsa.top.following
      method: GET
      path: /top-following
      summary: Top 20 followings by Sorsa Score.
    - id: sorsa.new.followers-7d
      method: GET
      path: /new-followers-7d
      summary: Accounts that started following the user in the last 7 days.
    - id: sorsa.new.following-7d
      method: GET
      path: /new-following-7d
      summary: Accounts the user started following in the last 7 days.
    - id: sorsa.tech.username-to-id
      method: GET
      path: /username-to-id/{user_handle}
      summary: Resolve a username to a stable numeric user ID.
    - id: sorsa.tech.id-to-username
      method: GET
      path: /id-to-username/{user_id}
      summary: Resolve a numeric user ID to the current username.
    - id: sorsa.tech.link-to-id
      method: GET
      path: /link-to-id
      summary: Parse a profile URL into a numeric user ID.
    - id: sorsa.tech.key-usage
      method: GET
      path: /key-usage-info
      summary: Report API-key total, remaining, and quota expiration.
